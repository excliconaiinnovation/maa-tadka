<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/maa-tadka-logo.jpeg" />
    <link rel="apple-touch-icon" href="/maa-tadka-logo.jpeg" />

    <!-- Mobile -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Maa Tadka | Authentic Indian Spices & Premium Masalas
    </title>

    <meta
      name="description"
      content="Maa Tadka brings authentic Indian spices and premium masalas crafted with care. Shop pure Haldi, Mirch, Dhaniya and traditional Indian spice blends."
    />

    <meta
      name="keywords"
      content="Maa Tadka, Indian spices, Indian masala, premium spices, Haldi powder, Mirch powder, Dhaniya powder, garam masala, Indian masalas, pure spices"
    />

    <meta name="author" content="Maa Tadka" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <link rel="canonical" href="https://maatadka.com/" />

    <!-- Theme -->
    <meta name="theme-color" content="#103F2C" />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Maa Tadka | Authentic Indian Spices"
    />

    <meta
      property="og:description"
      content="Premium Indian spices crafted with care to bring authentic aroma, colour and flavour to your everyday cooking."
    />

    <meta
      property="og:url"
      content="https://maatadka.com/"
    />

    <meta
      property="og:site_name"
      content="Maa Tadka"
    />

    <meta
      property="og:image"
      content="https://maatadka.com/maa-tadka-og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="Maa Tadka Premium Indian Spices"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Maa Tadka | Authentic Indian Spices"
    />

    <meta
      name="twitter:description"
      content="Shop authentic Indian spices and premium masalas from Maa Tadka."
    />

    <meta
      name="twitter:image"
      content="https://maatadka.com/maa-tadka-og-image.jpg"
    />

    <!-- Google / Search -->
    <meta
      name="application-name"
      content="Maa Tadka"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Maa Tadka",
        "url": "https://maatadka.com/",
        "description": "Authentic Indian spices and premium masalas.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://maatadka.com/products?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Brand Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Brand",
        "name": "Maa Tadka",
        "url": "https://maatadka.com/",
        "logo": "https://maatadka.com/maa-tadka-logo.jpeg"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
